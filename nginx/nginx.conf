server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 2g;
    proxy_read_timeout 300s;


    location ~ ^/(admin|index|api|backvideos|media|ws) {
        proxy_pass http://backend:8000;
        include /etc/nginx/app/include.websocket;
        include /etc/nginx/app/include.forwarded;
    }

    location /django-static/ {
        alias /home/src/app/static/;
    }

    location /django-media/ {
        alias /home/src/app/media/;
    }

    # Статика и медиа
    location /static/ {
        alias /usr/src/app/build/static/;
        try_files $uri =404;
    }

    location / {
        root   /usr/src/app/build;
        try_files $uri $uri/ /index.html =404;
    }

}